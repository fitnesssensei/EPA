# ============================================================
# Конфигурация линтера Ruff для проекта EvPrApi.
#
# Зачем нужен этот файл:
#   Без него Ruff работает на дефолтном наборе правил (E4/E7/E9/F)
#   и не знает целевую версию Python. То есть требование ТЗ
#   «линтер проверяет соответствие кода стандарту PEP8» выполнялось
#   бы формально: длина строки (E501), «белые» правила (W*) и
#   сортировка импортов (I*) не проверялись бы вообще.
#   Здесь это исправлено: явно заданы целевая версия Python,
#   длина строки и полный набор правил PEP8 + полезные дополнения.
#
# Важно про приоритет:
#   Ruff читает ЛИБО ruff.toml, ЛИБО секцию [tool.ruff] в
#   pyproject.toml. Приоритет — у ruff.toml. Поэтому вся
#   конфигурация линтера живёт ЗДЕСЬ, а pyproject.toml хранит
#   только метаданные проекта, зависимости и настройки pytest.
# ============================================================

# ------------------------------------------------------------
# Целевая версия Python (минимум, который мы поддерживаем).
# В pyproject.toml зафиксировано requires-python = ">=3.11".
# По этому значению Ruff решает, какие правила применимы
# (например, не предложит синтаксис новее py311).
# ------------------------------------------------------------
target-version = "py311"

# ------------------------------------------------------------
# Максимальная длина строки.
# PEP8 рекомендует 79 символов, но современная практика для
# Python-проектов — 88 (дефолт Ruff/Black) или 100.
# Значение используется сразу двумя инструментами:
#   ruff check   — правило E501 (строка длиннее лимита);
#   ruff format  — перенос длинных конструкций.
# ------------------------------------------------------------
line-length = 100

# ------------------------------------------------------------
# Отступ — 4 пробела. Это требование PEP8 для Python.
# ------------------------------------------------------------
indent-width = 4

# ------------------------------------------------------------
# Что НЕ проверяем.
# Часть путей (.venv, .git, .ruff_cache, __pycache__) Ruff
# исключает по умолчанию и дополнительно уважает .gitignore,
# но перечисляем их явно — так поведение линтера не зависит
# от настроек окружения и одинаково локально и в CI.
#   alembic/versions — код, который генерирует сам Alembic,
#   руками его не правят, поэтому линтером не трогаем.
# ------------------------------------------------------------
exclude = [
    ".venv",
    "venv",
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "alembic/versions",
]

# ============================================================
# Правила линтера ([lint]).
# ============================================================
[lint]

# Явный набор включённых правил:
#   E  — pycodestyle: ошибки PEP8 (в т.ч. E501 — длина строки);
#   W  — pycodestyle: «белые» предупреждения (W291/W293 — висячие пробелы);
#   F  — Pyflakes: неиспользуемые импорты/переменные, неопределённые имена;
#   I  — isort: порядок и группировка импортов (это и есть isort,
#        который ТЗ допускает как альтернативу Ruff);
#   B  — flake8-bugbear: типовые логические ошибки и «ловушки» Python;
#   C4 — flake8-comprehensions: более простые/быстрые генераторы;
#   UP — pyupgrade: устаревший синтаксис, который можно упростить;
#   SIM— flake8-simplify: избыточные конструкции, которые можно упростить.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

# Исключения из выбранных правил:
#   E203 — пробел перед двоеточием в срезах (a[1 : 2]). Форматтер Ruff
#          форматирует срезы именно так, поэтому правила конфликтуют;
#   B008 — вызов функции в значении аргумента по умолчанию. Это штатный
#          приём FastAPI: `param: int = Query(...)`, `svc=Depends(get_db)`.
ignore = ["E203", "B008"]

# ------------------------------------------------------------
# Настройки сортировки импортов (аналог isort).
# known-first-party = ["app"] — чтобы Ruff понимал, что пакет app
# принадлежит нашему проекту, и не путал его с третьими пакетами:
# иначе он сложит импорты app.* в раздел сторонних библиотек.
# ------------------------------------------------------------
[lint.isort]
known-first-party = ["app"]
combine-as-imports = true

# ------------------------------------------------------------
# Отдельные исключения по файлам.
# ------------------------------------------------------------
[lint.per-file-ignores]
# В пакетных __init__.py принято реэкспортировать символы
# (например, все модели или роутеры). Формально такие импорты
# «не используются», и без этого правила линтер валил бы их F401.
"__init__.py" = ["F401"]

# Шаблон Alembic: импорты там специально идут после настройки
# config/путей, то есть нарушают «импорты сверху» (E402).
"alembic/env.py" = ["E402"]

# Автогенерированные миграции: длинные строки и порядок импортов —
# не наша забота, файлы пишет Alembic.
"alembic/versions/*.py" = ["E501", "F401", "I001"]

# ============================================================
# Настройки форматтера ([format]) — используется ruff format,
# который в CI запускается вторым шагом (ruff format --check .).
# ============================================================
[format]
# Двойные кавычки — дефолтный стиль Ruff/Black.
quote-style = "double"
# Отступ — пробелы (PEP8), не табы.
indent-style = "space"
# Переводы строк LF — так файлы одинаково выглядят на macOS, Linux и в CI.
line-ending = "lf"
# Форматировать код внутри docstring-примеров (```python ... ```),
# чтобы примеры в документации тоже были аккуратными.
docstring-code-format = true
