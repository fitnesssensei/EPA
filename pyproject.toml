# ============================================================
# Метаданные проекта EvPrApi и список зависимостей.
#
# Раньше этот файл был пустым (0 байт), из-за чего:
#   • команда `pip install -e ".[dev]"` из плана не работала —
#     ей нечего было устанавливать;
#   • Ruff в CI ставился командой `pip install ruff` БЕЗ версии,
#     то есть любое обновление линтера могло внезапно уронить сборку;
#   • не было зафиксировано, какая версия Python поддерживается
#     (локально 3.14, в CI 3.12, в ТЗ — 3.9+).
# Теперь всё это задано явно.
#
# ВАЖНО: конфигурация самого линтера Ruff лежит в ruff.toml —
# Ruff читает либо ruff.toml, либо [tool.ruff] здесь, и приоритет
# у ruff.toml. Дублировать настройки не нужно.
# ============================================================

# ------------------------------------------------------------
# Как собирать проект: используется стандартный setuptools.
# Без этого блока `pip install -e .` не понимает, чем собирать пакет.
# ------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------
# Описание проекта.
# ------------------------------------------------------------
[project]
name = "evpr-api"
version = "0.1.0"
description = "Backend-сервис-агрегатор: интеграция с Events Provider API (события и регистрации)"
# ТЗ требует Python 3.9+, но на практике проект пишется на современном
# синтаксисе; локально окружение — Python 3.14, в CI — 3.12.
# Ставим нижнюю границу 3.11 и НЕ ограничиваем сверху, иначе
# editable-установка упадёт на локальном Python 3.14.
# (Если понадобится зафиксировать верхнюю границу, например <3.14
#  из-за колёс asyncpg, — правится здесь одной строкой.)
requires-python = ">=3.11"

# Основные (runtime) зависимости сервиса.
dependencies = [
    # --- веб-фреймворк и сервер ---
    "fastapi>=0.115",          # REST API, валидация, /docs из коробки
    "uvicorn[standard]>=0.30", # ASGI-сервер для запуска приложения
    # --- конфигурация и валидация ---
    "pydantic-settings>=2.4",  # чтение настроек из .env (Settings)
    # --- база данных ---
    "sqlalchemy[asyncio]>=2.0", # ORM + async-движок
    "asyncpg>=0.29",            # асинхронный драйвер PostgreSQL
    "alembic>=1.13",            # миграции схемы БД
    # --- интеграция с Events Provider API ---
    "httpx>=0.27",              # HTTP-клиент (в т.ч. async)
    "tenacity>=8.5",            # повторные попытки при сетевых сбоях
    # --- фоновая синхронизация ---
    "apscheduler>=3.10",        # планировщик периодических задач (worker)
    "python-dateutil>=2.9",     # разбор дат/времени из внешнего API
]

# ------------------------------------------------------------
# Dev-зависимости: всё, что нужно для разработки и CI.
# Установка: pip install -e ".[dev]"
# ------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Линтер PEP8. Версия ЗАПИНЕНА точно — локально и в CI должна
    # работать одна и та же версия: набор правил и стиль форматтера
    # у Ruff меняются между релизами, и «pip install ruff» без пина
    # рано или поздно покраснит сборку на пустом месте.
    "ruff==0.16.8",
    # Тестирование.
    "pytest>=8.2",
    "pytest-asyncio>=0.24",     # поддержка async-тестов (БД, httpx)
    "pytest-cov>=5.0",          # покрытие кода тестами
    "respx>=0.21",              # мок HTTP-запросов httpx к Events Provider
    "asgi-lifespan>=2.1",       # запуск lifespan приложения в тестах
]

# ------------------------------------------------------------
# Какие пакеты включать в сборку.
# Проект лежит «плоско» (app/, alembic/, tests/, scripts/), поэтому
# автоопределение пакетов у setuptools упало бы с ошибкой
# «Multiple top-level packages discovered». Указываем явно:
# в дистрибутив попадает только пакет app и его подпакеты.
# ------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "scripts*"]

# ============================================================
# Настройки pytest — используются локально (make test) и в CI.
# ============================================================
[tool.pytest.ini_options]
# Минимальная версия pytest, с которой настройки гарантированно работают.
minversion = "8.0"
# Где искать тесты.
testpaths = ["tests"]
# -ra            — в конце прогона показать сводку по «нестандартным» тестам
#                  (skipped/xfail) с причинами;
# --strict-markers — упасть, если в тесте используется маркер,
#                  не объявленный в [markers]. Защита от опечаток.
addopts = "-ra --strict-markers"
# Асинхронные тесты пишем просто как async def — без @pytest.mark.asyncio.
# Удобно для тестов, где вызываются async-эндпоинты и async-сессии БД.
asyncio_mode = "auto"
# Область действия event loop для фикстур (pytest-asyncio >= 0.24).
asyncio_default_fixture_loop_scope = "function"

