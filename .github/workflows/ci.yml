# ============================================================
# GitHub Actions: CI/CD пайплайн проекта EvPrApi.
#
# Главное требование ТЗ: линтер (PEP8, инструмент Ruff) обязан
# запускаться ДО шага деплоя, и деплой без успешного линтера
# невозможен. Реализовано цепочкой зависимостей между джобами:
#
#     lint ──> test ──> deploy
#
# Джоба deploy объявляет `needs: [ lint, test ]`, поэтому GitHub
# физически не запустит её, пока линтер не прошёл успешно.
#
# Файл называется ci.yml (как в плане проекта): раньше пайплайн
# лежал в deploy.yml и не содержал шага тестов — теперь это один
# файл с полной цепочкой lint → test → deploy.
# ============================================================
name: CI

# Когда запускать пайплайн.
on:
  # Любой push в основную ветку.
  push:
    branches: [ main ]
  # Любой pull request (проверяем код до слияния).
  pull_request:
  # Ручной запуск из вкладки Actions (кнопка "Run workflow").
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------
  # Джоба 1: проверка стиля кода линтером Ruff.
  # Проверяет соответствие кода стандарту PEP8:
  #   ruff check .          — ошибки и нарушения правил;
  #   ruff format --check . — единый стиль форматирования.
  # Набор правил, длина строки и целевая версия Python заданы
  # в ruff.toml — то есть локально и в CI правила одинаковые.
  # ----------------------------------------------------------
  lint:
    name: Линтер PEP8 (Ruff)
    runs-on: ubuntu-latest
    steps:
      # Забираем код репозитория в раннер.
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # Ставим Python 3.12: стабильная версия, удовлетворяет
      # требованию ТЗ «3.9+» и совпадает с requires-python >= 3.11.
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ставим зависимости проекта вместе с dev-группой.
      # Именно так версия Ruff берётся из ОДНОГО места —
      # pyproject.toml (ruff==0.16.8), а не «какая-нибудь последняя»:
      # обновление линтера не должно ломать сборку внезапно.
      - name: Установка зависимостей (с Ruff из dev-группы)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Пишем версию в лог — удобно при разборе упавших сборок.
      - name: Версия Ruff
        run: ruff --version

      # Защита от «ложнозелёного» линтера.
      # Сейчас в репозитории лежат только пустые файлы-заготовки,
      # и `ruff check .` проходит успешно, ничего фактически не
      # проверяя. Шаг печатает ПРЕДУПРЕЖДЕНИЕ (жёлтая плашка в
      # GitHub), пока в репозитории нет ни одного .py с кодом.
      # Предупреждение исчезнет само, как только появится код.
      # Нужно жёстко запрещать такой прогон — заменить строку
      # с echo на `exit 1`.
      - name: Проверка, что есть код для линтинга
        run: |
          count=$(git ls-files '*.py' | xargs wc -c | awk '$2 != "total" && $1 > 0 { n++ } END { print n + 0 }')
          echo "Файлов .py с непустым содержимым: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::В репозитории нет ни одного непустого .py — линтер проверяет пустые заготовки, результат не показателен."
          fi

      # Проверка кода на нарушения PEP8 и типовые ошибки.
      - name: Проверка кода линтером (ruff check)
        run: ruff check .

      # Проверка, что код отформатирован единообразно.
      - name: Проверка форматирования (ruff format --check)
        run: ruff format --check .

  # ----------------------------------------------------------
  # Джоба 2: тесты.
  # Запускается только после успешного линтера (`needs: [ lint ]`):
  # нет смысла тестировать код, который не проходит проверку стиля.
  # Пока в tests/ нет ни одного теста, шаг печатает предупреждение
  # и завершается успешно — иначе pytest отдал бы код возврата 5
  # («тесты не найдены») и пайплайн был бы красным на пустом каркасе.
  # ----------------------------------------------------------
  test:
    name: Тесты (pytest)
    needs: [ lint ]
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Запуск тестов
        run: |
          if ! git ls-files 'tests/*.py' | xargs grep -lE '^(async )?def test_' > /dev/null 2>&1; then
            echo "::warning::В tests/ пока нет тестов — шаг пропущен (каркас ещё пустой)."
            exit 0
          fi
          pytest -q

  # ----------------------------------------------------------
  # Джоба 3: деплой.
  # Ключевой момент — `needs: [ lint, test ]`: GitHub не запустит
  # эту джобу, пока линтер и тесты не завершатся успешно. Именно
  # так выполняется требование ТЗ: деплой без линтера не допускается.
  # ----------------------------------------------------------
  deploy:
    name: Деплой
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    # Деплой только из основной ветки и только не по pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # Заглушка: сюда позже встанет реальный шаг деплоя
      # (сборка Docker-образа, публикация, выкатка на сервер).
      - name: Шаг деплоя
        run: echo "Линтер и тесты пройдены — деплой разрешён"